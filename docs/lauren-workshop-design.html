 it simple uh if i if to be a little cheeky and i think that's actually really real it's like a lot of ai applications have you know a lot of control and power that they give you but sometimes that power is like balanced with complexity and so really our design brief here was like how can we make this really simple first and foremost and so that's kind of where the messaging interface became a little bit inspired from and then of course some of the design touches that we added over time i don't know lauren if you'd add anything kind of having built it all uh i would say i built it all but um i think uh that the team really strove for a very clean simple user interface because like you know if you've used cursor you're probably like a power developer power user it's like very there's like a lot of knobs and whistles and and uh like very it's very tailored focus for coding and with Grok Bot we really wanted to take a fresh perspective on what would it look like if your agent was really more like a colleague."},{id:"t-33573",t:"55:57",start:3357.3,end:3368.68,block:"s7-7",text:"所以你不一定想微觀管理你的同事，說你現在在用哪些 tool calls？你想跟它像跟人講話一樣。你想看他們在電腦上在做什麼。",en:"And so you don't necessarily want to micromanage your colleague and say, what tool calls are you using right now? But you want to talk to it like a person. You want to see what they're doing on their computer."},{id:"t-33700",t:"56:10",start:3370.02,end:3386,block:"s7-7",text:"所以我們試著把介面做得非常優雅、簡單。超酷。我很喜歡你們兩位一起接受訪問，因為有產品面，有軟體工程面。幕後其實還有一整個團隊。這上面花了很多功夫。噢等一下，除了你們兩位還有其他人？",en:"So we've tried to keep the interface really elegant and simple. Really cool. I love that I have both of you two on the interview because We have the product side, we have the software engineering side. It's a whole team behind the scenes, too. There's a lot of work on this. Oh, wait, there's more people besides just you two?"},{id:"t-33873",t:"56:27",start:3387.38,end:3418.42,block:"s7-7",text:"上面？沒有，當然有。所以你們兩位都在，可以很全面地看到做出 Grok Bot、把這個產品推到 mainstream 到底需要什麼。我也知道用戶可能跟典型的 Cursor 用戶有點不一樣。你們想像 Grok Bot 的 mainstream 採用者會是誰？對，我覺得我們真的認為這對每個人都有用。有點像我們內部看到這次上線時說的，外面有很多工作其實非常適合被做得更有效率。",en:"On it? No, for sure. And so having you both here, you get a really comprehensive overview of what it actually takes to create Grok Bot and get this product into the mainstream. I do know the user might be a little bit different from the typical cursor user. Who are you envisioning are going to be the mainstream adopters of Grok Bot? Yeah, I think we really see this being useful for everyone. So kind of like what we were saying when we saw this launch internally, I think there's a lot of work out there that's just rife to be made more efficient."},{id:"t-34193",t:"56:59",start:3419.32,end:3547.94,block:"s7-7",text:"而我覺得我們內部為什麼做這個，動機是我們看到 Cursor 裡一堆人在自己做 agents，有點像自己拼 chats、做 Slack bots。其實 Lauren 有一個很有名的 Slack bot，到現在還活在我們的 Slack 裡。那樣子要把東西組起來需要很多 context，所以想法是，我們能不能把它包起來？那些 bots 是給部署工程、軟體工程、還有我們 ops 團隊用的，然後我們就想說，能不能用很有趣的方式把它產品化。對，我常常講我做的那個叫 Benny 的 bot，牠像一隻小狗，那是牠的 avatar，但我對 Benny 的想法其實是，我這個人頗懶，然後我想搞清楚怎麼辦，我們 Cursor 收到超多 bug reports 對吧，我想全部修掉。所以我開始想，我要怎麼讓我的 agents 在我睡覺的時候自動幫我修 bug，那就是我們早期一些實驗的靈感，去做比較 persistent 的 bot。我覺得有些想法是從那邊帶過來的，因為我被問超多次，你怎麼做出來的、我要怎麼做自己的，我想那啟發了 Grok Bot 背後的一些想法，像是如果每個人都能定義自己的 bot，給它一個 identity，再給它自己的電腦、還有 routines 跟自動化。像我現在就有 bots，每次有人給 Grok Bot 回饋，我的 bots 就自動去修，我只要 review 他們的 code。那你現在的工作是什麼？這確實變得很有意思，我幾乎像是我數位同事的 manager。對，蠻有意思的。其實 Grok Bot 有多少是用 Grok Bot 做出來的，這點也很驚人。對，這是一個超酷的 feedback loop，這些 agents 可以自己 triage issues，可以寫 code，也可以連到 cloud agents。不知道 Lauren 你那邊有沒有我們想分享的 demo。",en:"And I think the motivation for why we built this internally is we actually saw a bunch of folks within Cursor who were building their own agents, kind of like constructing the chats together, building Slack bots. Actually, Lauren had a really famous Slack bot that still lives in our Slack instance. and it's sort of like that takes a lot of context to put together uh and so the idea was well could we package that up and these bots were for for deployed engineering and for like software engineering for our ops teams and and really just wanting to say like could we productize that in a really in a really fun way so yeah yeah uh so yeah i i talk a lot about this bot that i built called benny he's like this little dog uh that's his avatar but uh the idea i had with benny was really uh you know like i'm a fairly lazy person uh and i wanted to figure out how can i you know we're getting so many bug reports for a cursor right and and i wanted to just fix them all yeah uh and so i started thinking about how would i make it so my agents can just automatically fix bugs for me while i sleep and so that was the inspiration for some of our earlier experiments with you know building like uh like a more like persistent bot uh and so i think there were some ideas that we took from there because i got so many questions like how do you how did you build any how can i build my own i think that inspired uh some of the thinking behind Grok Bot like you know what if everybody could define one of their own uh like bots you know give it an identity and give it things like its own computer plus routines and automations so like i have like a bot like bots right now that are you know every time someone gives us feedback on Grok Bot my bots are automatically going off and fixing them for me and i just like review their code so what's your job now it's definitely become interesting it's like i'm almost like a manager for my for my digital colleagues yeah so it's pretty interesting it's actually remarkable how much of Grok Bot was built with Grok Bot too yeah that's like it was a it's been a really cool feedback loop where these agents can self-triage issues they can they can write code and so they can connect to cloud agents and i don't know if you have a demo of that lauren that we wanted to share."},{id:"t-35479",t:"59:07",start:3547.94,end:3563.94,block:"s7-7",text:"對，我有。喔，我超愛這些 demo。這太好玩了。體驗這個最好的方式就是做成互動式的。沒錯。你解釋完一件事，然後你會想，哇，我剛好有個 demo 開著。讓我現在直接秀給你看它實際上怎麼運作。我們會在贊助商訊息之後繼續監控。",en:"Yeah, I do. Ooh, I love these demos. This is so fun. It's like the best way to experience this is to make it interactive. Exactly. You explain something and you're like, wow, I do have a demo pulled up. Let me just show you now how it actually works. We'll continue monitoring right after this message from our sponsors."},{id:"t-35648",t:"59:24",start:3564.8,end:3570.76,block:"s7-7",text:"Eleven Labs，能在每個管道與模態以人類水準溝通的 AI。Elevenlabs.io slash MTS。",en:"Eleven Labs, AI that communicates at human level across every channel and modality. Elevenlabs.io slash MTS."},{id:"t-35750",t:"59:35",start:3575.01,end:3585.83,block:"s7-7",text:"在 Neon 上擴展你的新創。數百萬開發者與新創已經選擇 Neon 作為後端。從免費方案開始，或為你的新創取得高達十萬美元的點數，網址 neon.com.mts。",en:"Scale your startup on Neon. Millions of developers and startups have already chosen Neon for their backend. Start on the free plan or get up to $100,000 in credits for your startup at neon.com.mts."},{id:"t-35897",t:"59:49",start:3589.73,end:3598.59,block:"s7-7",text:"特別感謝我們的贊助商 Kong，AI 連通平台。以嚴謹的安全性與治理連接 API、LLM、代理與系統。konghq.com。",en:"Special thanks to our sponsor Kong, the AI connectivity platform. Connect APIs, LLMs, agents, and systems with serious security and governance. konghq.com."},{id:"t-36023",t:"60:02",start:3602.32,end:3670.61,block:"s7-7",text:"對，所以我有點，我已經問過我的幕僚長，今天有沒有看到什麼有趣的 bug。然後它找到了幾個。你也可以看到我在我的 bot 電腦上開著 X，以防萬一，不過對，我可以叫它派發，所以我這邊有一個 sand team，抱歉是 Grok Bot team，他們各自負責不同的功能，然後現在我的幕僚長會把那些任務派給那些代理，過一分鐘我們就會看到一堆訊息，我會傳給我不同的團隊成員，然後他們會去做那些任務，最後我會拿到一個可以 review 的 pull request，會有影片、會有截圖，對，所以這是另一個例子，這是我的工程團隊代理之一，我覺得這幾乎是一個不太明顯的功能，但如果你在 Cursor 上設定了 cloud agents，你的 Grok Bot bots 其實可以把它們啟動起來。",en:"Yeah, so I kind of, I asked my chief of staff already, like if there's any interesting bugs that we saw today. And it's found a few. You can also see I have X open on the, on the my bots computer just in case uh but yeah you know i can i can tell it to dispatch uh so like i have a i have a sand team over here i'm sorry a Grok Bot team uh so each of them kind of are responsible for a different feature uh and so now my chief of staff is gonna like send off those tasks to those uh agents uh and in a minute we'll see a bunch of messages that i'll send to the you my different my team members uh and then they'll go off and actually work on those tasks uh and then at the end of it i'll get like a pull request that i can review i'll get videos i'll get a screenshot um and uh yeah so like here's another example where uh this is like one of my engineering team agents and uh i think this is like almost like a feature that's not super obvious but uh If you set up cloud agents on Cursor, your Grok Bot bots can actually kick them off."},{id:"t-36709",t:"61:10",start:3670.91,end:3678.49,block:"s7-7",text:"所以在這裡，我有一個 cloud agent 正在跑，有它自己的電腦，由這個代理在管理。",en:"So here, I have a cloud agent that's running with its own computer that this agent is managing."},{id:"t-36795",t:"61:19",start:3679.56,end:3707.38,block:"s7-7",text:"然後它已經有一堆事情在進行中了。所以我之後有一堆 PR 要 review。我覺得軟體開發的未來有一件事真的很令人興奮，就是真的在跟一堆做特定任務的代理對話、一起工作，然後你退一步，變成他們的管理者。而那種願景在這裡以一種很好玩的方式成真了。太厲害了。而且我看到這裡是一堆貓的照片。喔對。所以你所有的代理都是真的貓。",en:"And so it's got a bunch of things in flight already. So I have a bunch of PRs to review later. I think there's something really exciting about the future of software development here, too, where it's really talking to and working with a bunch of agents that are doing specific tasks And then you kind of just step back and become the manager of them. And it sort of feels like that vision is coming true in a really fun way here. That's amazing. And I see here it's a bunch of cat photos. Oh, yeah. So all your agents are actual cats."},{id:"t-37076",t:"61:47",start:3707.62,end:3714.78,block:"s7-7",text:"對，我就是愛貓。所以我決定給他們很蠢的大頭貼，好讓我的 Grok Bot 有一點個人風格。",en:"Yeah, I just love cats. So I decided to give them silly profile pictures just to personalize my Grok Bot a little bit."},{id:"t-37158",t:"61:55",start:3715.8,end:3746.06,block:"s7-7",text:"我是說，預設的 Grok Bot 頭像也超可愛。而且我加這些是在我們加那些之前。但就是玩玩而已，對吧？對。Roshan，你剛才提到一件事，那當然是 agentic coding 未來正在發生的趨勢。而 Cursor 一直站在最前線看這一切發生。越來越多的程式碼被自動化，由這些代理來完成。所以作為人類，你變成這些代理的操偶師，他們幫你處理所有這些任務。我知道那是你特別興奮的一個世界。",en:"I mean, the default Grok Bot avatars are super cute as well. And I added these before we added those. But it's just having a bit of fun, you know? Yeah. Roshan, you hinted towards something that is a trend that, of course, is happening with the future of agentic coding. And Cursor has been at the front and center of seeing all of this happen. More and more code is getting automated and is done by these agents. And so as a human, you become this puppeteer of agents who are handling all these tasks for you. I know that's a world that you are particularly excited about."},{id:"t-37465",t:"62:26",start:3746.5,end:3765.82,block:"s7-7",text:"你可以再多分享一點嗎？你為什麼對這個感到興奮？這在人的層面到底解鎖了什麼，可能是主流觀眾沒意識到的？對，完全可以。我覺得如果要我選一個詞，就是效率。我覺得不管職位是什麼，大家腦子裡都有超多想法。像我自己就有很多產品想法想做進 Cursor。",en:"Can you share a little bit more? Why are you excited about that? What does that actually unlock at maybe the human level that people in the mainstream audience might not realize? Yeah, totally. I think that, like, if I had to pick one word, it would be efficiency. I think there's so many ideas in people's heads, regardless of role, again. Like, I have so many product ideas I want to build into Cursor."},{id:"t-37668",t:"62:46",start:3766.82,end:3802.84,block:"s7-7",text:"而這就是限制因素。從想法到存在的那條管線裡，總是會有瓶頸。所以我覺得這個承諾是：你可以把一群 agents 丟去處理這些問題，然後它們產出真的高品質、而且跟我自己會放進產品的品味對齊的東西，這就是願景對吧？這差不多就是那個夢想。就是能從想法走到存在。所以對我來說，要努力的方向是：我們能不能把這些東西做成，不管我是在管理一堆 agents、還是請 agents 去管其他 agents、還是跟 Lauren 的 agents 一起工作，不管長什麼樣，我們都能真的把那個週期一再縮短、壓縮、再壓縮。",en:"And it's the limiting factor. Like, there's always some bottleneck in that, like, idea to existence pipeline. And so I think the promise of being able to throw fleets of agents at these problems and then have them produce things that are really high quality and sort of aligned with the taste that I would myself put into a product, that's the vision, right? That's sort of the dream. It's like being able to go from thought to existence. So to me, that's the thing to work towards is can we build these things in a way where whether I'm managing a bunch of agents or asking agents to manage other agents or working with Lauren's agents or whatever that looks like, we're able to really shorten, compress, compress, compress that cycle more and more."},{id:"t-38029",t:"63:22",start:3802.92,end:3823.46,block:"s7-7",text:"而且如果你看 Cursor 作為一家公司的演進，某種程度上我們就是這樣往那個未來打造自己的：持續導入越來越多 agent 工具跟複雜度。所以對，我覺得那就是願景，我們也很興奮。那在軟體工程團隊這邊有什麼變化？從你剛開始在 Cursor 工作到現在，有什麼不同？",en:"And I think if you kind of like look at the evolution of Cursor as a company, that's sort of how we've built in a lot of ways, built ourselves towards that future is by, you know, continuing to introduce more and more sort of like agent tools and complexity there. So, yeah, I think that's the vision and we're excited for it. And then how has it changed on the software engineering team? What differences from when you started working at Cursor to how it is now?"},{id:"t-38246",t:"63:44",start:3824.6,end:4117.43,block:"s7-7",text:"我覺得在 agent 的世界裡，工程師角色的演進方式是，就像我提過的，你有點像是自己那些 agents 的工程經理。但我覺得我們現在作為工程師的一大責任，也包括把 codebase 維持在一個狀態，讓產品經理、設計師也能貢獻高品質的程式碼，這也是我在 Twitter 上常講的：投資在重構、改寫，甚至重寫你的 codebase，讓 agents 真的能好好發揮，就算有時候它們不是很聰明的 agents。像是把你的規則跟風格指南編碼成真正的 lint 規則，或是會讓 CI 失敗的硬性約束。所以我覺得那個大解鎖是：作為工程師，我可以賦能超多人去做他們以前做不到的事，我自己也能做以前做不到的事，因為我在 Cursor 做過很多大型重構跟遷移，而且幾乎是我一個人做的。哇。就是帶著那些 cat agents，對，那些 cat agents 整個狂奔，我轉換了一堆東西，本來要我或一組工程師花好幾個月甚至好幾年才做完的。哇，太猛了。而從外人的角度你可能會想，好，現在 agents 都能寫這些程式了，軟體工程師的角色還剩什麼？但如果你真的看現場在發生什麼，對這些工程師的需求比以往都還高。而且大概就往你剛剛暗示的那個方向。現在你能用軟體把從想法到執行的時間線壓得這麼短。我們現在才剛有像 Grok Bot 這種東西，那是你們在做的。然後你還能用 Grok Bot 去建 Grok Bot，再丟進商業產品。這也是你看到越來越多的趨勢嗎？對。我是說，原型化想法的時間已經大幅下降了，所以測試東西真的很快。我覺得我們，像 Grok Bot 背後那組團隊，能動得超快，就是因為這些工具變好了。當然模型變強也是很大一塊。所以對，講到 Grok Bot 這邊，動機真的就是我們怎麼能讓這個產品對大家越來越有幫助。至於趨勢，我覺得這會越來越容易。我覺得人還是有很強的角色要扮演，不管是品味那套論點還是其他組合。但對，我覺得想法到處都是，看到越來越多成真會很令人興奮。哇。對，我個人很喜歡的那個類比或隱喻是這樣：我很喜歡食物，我是美食愛好者，我有點把我的 agents 想成一個廚房，我叫它米其林廚房。所以也許我的角色變了，我可能不再自己煮所有菜，但我有一組 bots 跟 agents，像是我聘來的，我透過 skills 或重構訓練它們，用我會用的方式寫出好程式。所以我的角色變得比較像主廚：也許我組盤、我負責品質控管。但如果你大量投資，早早擁有一組有能力的 agents，你就能做多很多。再想想，你團隊裡每個工程師都能有一組這樣的隊伍在後面，你真的能解決更多問題，能做更多功能，不是每個都該做，但你有高很多的生產力跟速度。對，我喜歡你暗示的那個內部文化：你們真的會做東西、測一測，而且 Cursor 員工自己對其他工程師、其他產品人、大概一般消費者想看到存在的東西，有某種品味。你有沒有什麼提示可以分享，沒有也沒關係，關於接下來可能會有什麼，或是內部有人在做的東西？對，我是說我們絕對想把 Grok Bot 做得更好。我們昨天以 beta 推出，各種形狀大小的回饋湧進來。我們的目標就是盡可能讓這些助理、這些 bots 有幫助。所以絕對會繼續投資那塊。當然也很興奮模型變強，興奮能參與那個對話，而且現在有 frontier models 了。所以我覺得我們會繼續在那塊大舉投資，然後還有更多好玩的東西會來。但整體來說，我對未來非常看好，對 coding agents 跟通用 agents 的未來都很看好，我覺得會是一段很好玩的時光。",en:"I think it's like the way I see engineers roles evolve in the agent world is, you know, like I mentioned, you're sort of like an engineering manager for your agents. But I think a big part of our responsibility now as engineers is also to like, you know, keep the code base in in a condition where you know product managers designers can contribute like high quality code and that's something i talk a lot about on twitter as well which is you know like investing in refactoring rewriting even rewriting your code base so that agents can really thrive even if you're not like or they don't you know they're not very smart agents sometimes uh you know like things like encoding your rules and your style guides into actual uh like lint rules or hard constraints that uh you know fail ci so that again like the the i think the big unlock is uh as an engineer i can empower like so many other people to do things that they couldn't do before and i can do things that i couldn't do before as well because like you know i've done a lot of big refactors and migrations uh at cursor and i did them like mostly by myself wow like with one of all the cat agents yeah all the cat agents were just going wild and like you know i converted you know a bunch of stuff uh you know which would have taken me or a team of engineers months or even years to finish wow that's incredible and as an outsider's perspective you might think okay now that agents can do all this coding what's the role of a software engineer and if you actually look at what's happening on the ground, there's more demand than ever for more and more of these engineers. And it's probably towards something that you hinted. Now that you can build software with the thought to execution timeline is getting so condensed. We just now get something like Grok Bot that started off as that's something you guys are building. And then you could use Grok Bot to now build Grok Bot and put it out into commercial production. Is that also what you're seeing just as a trend happen more and more? Yeah. I mean, I think the time to prototype ideas has gone down a bunch. And so it's really quick to test things. I think we've been able, like the team behind Grok Bot has been able to move incredibly quickly just because of these tools getting better. And obviously the model is getting better as a huge component of that. And so, yeah, I think that like to bring it to the Grok Bot side of things, the motivation there is really around how can we make this product more and more helpful for folks. As far as the trend, I think like this is going to get easier. I think there's still a really strong role for people to play and all that too right whether it's the taste argument or some other combination like that but yeah i think it's just um ideas are you know abound and it's just going to be exciting to see more and more of them come to reality wow yeah the the sort of analogy or metaphor that i that i personally like a lot is this idea that uh so i like food yeah i'm a big lover of food and uh i kind of think of my agents as sort of like uh like a kitchen a michelin kitchen is what i call it and so like maybe my role has sort of changed in that maybe i'm not you know cooking all the food myself anymore uh but i have a team of bots and agents that are that i've sort of hired right and i've trained through skills or uh like refactoring to do good code the way that i would have done it and so my role is becoming more like you know like a head chef right like i i maybe assemble a plate to the food i you know i i own the quality control but you know if you invest a lot in in having like early capable team of agents you can just do so much more and now think about that like with every engineer in your team can have one of these teams behind them uh you can really you can solve a lot more problems you know you can build more features not all of them should be built but you know you you have much more productivity and velocity yeah i do like what you hinted about the internal culture of you actually build things you test it out and that the employees themselves at cursor have a certain taste for what other engineers what other product people what other consumers i guess in general would want to see exist do you have any hints that you can maybe share okay if you don't but of what might be coming up or even something that people are working on internally yeah i mean we definitely want to make Grok Bot better. We launched this as a beta yesterday. And so tons of feedback coming in of all shapes and sizes. Our goal there is just to make this as helpful, these assistants, these bots as helpful as we can. And so definitely going to continue investing there. Obviously, really excited about the models getting better too, and excited to be a part of that conversation and to have frontier models now. And so I think we're going to continue to just invest a bunch in that space and then some more fun stuff to come to. But I think overall, just very bullish on the future and the future of both coding agents but also general purpose agents and I think it's going to be a really fun time."},{id:"t-41190",t:"68:39",start:4119.05,end:4172.67,block:"s7-7",text:"我個人真的很興奮能看到更多效能跟可靠性，作為工程師那是我很在意的事。我們有一些很有意思的功能正在討論。其實早期我塞進 Grok Bot 的一件事是支援 iMessage，這樣你真的可以傳訊給你的 bots。我不知道我們會不會幫 Grok 加這個，但我知道這是常見需求，所以我們絕對在想這類東西。心智模型就是：這些是同事對吧？所以你的同事不是只能透過 Slack 找得到，你可以傳訊給他們、可以打電話給他們。想像一個世界，你有這些隨時在線的同事，你可以隨時隨地跟他們講話，而他們就在那邊幫你做好事，這很有意思。天啊，我等不及可以傳訊或打電話給他們了。",en:"I'm personally really excited to see more performance and reliability as an engineer and that's something I care about a lot. We have some really interesting features that we're debating. Actually, one thing that I hacked into Grok Bot in the early days was support for iMessage so you can actually text your bots i don't know if we'll add it for for Grok but i know it's like a common ask so we're definitely like you know thinking about things like this where again it's like the mental model is these are colleagues right you know so like how do you like your your colleague is accessible not just through slack right that you can text them you can call them uh so it's interesting to kind of imagine a world where you have these always on colleagues that you can talk to at anytime from anywhere uh and they're just off doing good work for you oh my gosh i can't wait to be able to text them or call them."},{id:"t-41730",t:"69:33",start:4173.01,end:4200.27,block:"s7-7",text:"我看過一個迷因，大概是：我的 agents 在 standup 互相講，然後它們說抱歉，我整個週末都沒上線。然後就像，你是個 agent 耶。我也不確定那到底是什麼意思。對，也許我們需要 agent 特休。對，agent 特休，把電腦關掉。來吧。最後一件我真的想提的，因為這真的很猛：你們當然不只在做 Grok Bot、不只在應用層，也在模型層。然後 Grok 4.6，CursorBench 上的 benchmarks 出來了。",en:"I saw this meme where it's like, my agents were talking to each other in their standup and they're like, sorry, I was off like all weekend. It's like, you're an agent. I don't know exactly what that means. Yeah, maybe we need agent PTO. Yeah, agent PTO, turn your computer off. Let's do it. One last thing I did want to bring up because this is really impressive is you guys, of course, we're not just working on Grok Bot, not just working on the application layer, but also on the model layer. And Grok 4.6, the benchmarks came out on CursorBench."},{id:"t-42002",t:"70:00",start:4200.27,end:4261.98,block:"s7-7",text:"3.2，真的很驚人。我想趁我們還有時間，在直播上講一下。Grok 4.6 extra high 拿到 70.8%，平均每個任務成本 2.81。對照一下，Fable 5 Max 拿到 70.5%，但要花 17.32 美元。這是巨大的變化。這個模型可能會怎麼改變一般消費者跟 agents、跟 AI 整體的互動方式？對，你先說。所以對，這絕對是我很放在心上的事，因為我常想這個：我在 Cursor 工作，我有無限 tokens，所以我可以瘋狂刷 token，但顯然很多我們的客戶跟使用者比較在意成本。所以我個人最興奮的是：你有一個非常有效率的模型，跟其他一些大模型一樣好，但成本只是零頭。",en:"3.2 and were really impressive. And I wanted to address them here on air while we still have time. You had Grok 4.6 extra high scored 70.8% at an average cost of 2.81 per task. For context, Fable 5 Max scored 70.5%, but at $17.32. This is a huge change. How does this model maybe change how the everyday consumer actually interacts with agents with ai as a whole yeah go ahead uh so yeah this is definitely like very top of mind for me because uh you know i think about this a lot because i i work at cursor i have unlimited tokens and so i can just you know you know go crazy with token maxing but obviously a lot of our customers and our users are you know are more cost conscious so personally what i'm most excited about is this idea that you have a very efficient model that is as good as some of the other big models, but at a fraction of the cost."},{id:"t-42625",t:"71:02",start:4262.56,end:4328.26,block:"s7-7",text:"而且我覺得這是很多領導跟工程師現在都在談的很重要議題：使用 AI 的成本不斷上升。所以我覺得在那個討論裡，Grok 4.6 是一個很有意思的選擇。每間公司對自己要用的模型組合都會有自己的要求，所以我覺得 Grok 4.6 是一個非常有吸引力的選項對吧？如果你在考慮那些更大的模型，它們也非常強，但你想要稍微便宜一點的，Grok 就是很棒的選擇。對，就像你有二十塊美金的預算要做完所有 AI 任務，每個任務成本降下去，你就能做更多任務。所以我覺得效率這場遊戲超好玩，因為感覺你就是能做更多：你可以有更多 bots，或寫更多程式。所以對，就是這個想法，而且我覺得這正在整個產業發生，非常令人興奮，就是用這些 tokens 能做更多事情，就這樣。",en:"And I feel like that's a very important topic that a lot of leaders and engineers are having right now, which is the rising cost of using AI. So I think Grok 4.6 is a really interesting choice in that discussion. you know like every every company is going to have their own requirements for the type of model mix that they use so i think grok 4.6 makes a very compelling you know a very compelling option right if you're considering between like some of the the bigger models which are also extremely capable but you want something like a little bit more you know cheaper grok is like an excellent choice yeah it's like if you have a budget of 20 bucks to do all of your ai tasks and the cost per task goes down it's like you can just do more tasks so i think the efficiency game is just such a fun one to play because it feels like you just can do more like you can have more bots or write more code and so yeah just like this idea and i think this is happening across the industry which is very exciting but just like being able to do more things with the tokens are just like"}]};function mf(i){let{copy:o,lang:t}=i,a=yf.quotes,e=o.labels;return I("div",{lang:t==="zh"?"zh-Hant":"en",children:[I(En,{children:[m("p",{className:"tldr",children:e.background}),m("p",{children:o.background}),m("p",{className:"tldr",children:e.see}),m("p",{children:o.problem}),m("ol",{className:"enum",children:o.problemItems.map((r,l)=>I("li",{children:[m("span",{className:"n",children:l+1}),m("strong",{children:r.title}),m("span",{className:"d",children:r.why})]},r.title))}),m("p",{className:"tldr",children:e.did}),m("ol",{className:"enum",children:o.solutions.map((r)=>I("li",{children:[m("span",{className:"n",children:r.mapsTo}),m("strong",{children:r.title}),I("span",{className:"d",children:[e.mapsTo," ",r.mapsTo,". ",r.process," ",r.reason]})]},r.title))})]}),o.blocks.map((r)=>I("section",{className:"tape-cut",children:[I("h2",{id:r.id,children:[m("span",{className:"no",children:r.n}),r.title]}),I("p",{children:[m("span",{className:"when",children:r.when}),r.body]}),m(bf,{lang:t,segments:a.filter((l)=>l.block===r.id)})]},r.id))]})}function vf(i){let o=i.copy.plugin;return I("section",{className:"tape-cut",children:[m("h2",{id:"plugin",children:o.title}),m("p",{children:o.lede}),m("p",{className:"src",children:m("a",{className:"xref",href:o.url,children:o.url.replace("https://","")})})]})}var xf="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQ <script>
/* design-explainer rail / spy / gloss / srcpane. Call initExplainerShell()
   after React paints. Safe to call twice only if you reload the page. */
window.initExplainerShell = window.initExplainerShell || function initExplainerShell() {
  if (window.__explainerShellOn) return;
  window.__explainerShellOn = true;
(function () {
  var toc = document.querySelector("nav.toc");
  var doc = document.querySelector(".doc");
  if (!toc || !doc) return;
  function tokenPx(name, fallback) {
    var probe = document.createElement("div");
    probe.style.cssText = "position:absolute;left:-9999px;top:0;height:0;padding:0;border:0;margin:0;width:var(" + name + ")";
    document.documentElement.appendChild(probe);
    var w = probe.getBoundingClientRect().width;
    document.documentElement.removeChild(probe);
    return w || fallback;
  }
  function fit() {
    /* .doc 已不再把 --side-w 當右溝（見 explainer.css）,左欄只要放得下
       正文 + 目錄。把已死的 side 加進去會在筆電寬度關掉左欄,索引只剩
       目錄鈕。`|| vw >= 720` 仍不要用:那會在窄窗開欄、推出橫向捲軸。 */
    var vw = document.documentElement.clientWidth;
    var need = tokenPx("--prose", 720) + tokenPx("--rail-w", 240)
             + tokenPx("--rail-gap", 48) + 24;
    document.body.classList.toggle("rail-on", vw >= need);
  }
  var timer;
  function schedule() { clearTimeout(timer); timer = setTimeout(fit, 40); }
  window.addEventListener("resize", schedule);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", schedule);
  fit();

  /* 放不下左欄時的第二種呈現:同一個 nav 拉出來。連結一點就關,因為它蓋著正文。 */
  var tocBtn = document.getElementById("tocbtn");
  var tocScrim = document.getElementById("tocscrim");
  var tocClose = document.getElementById("tocclose");
  if (tocBtn) {
    toc.setAttribute("tabindex", "-1");
    var setToc = function (open) {
      document.body.classList.toggle("toc-open", open);
      tocBtn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) { toc.focus(); } else { tocBtn.focus(); }
    };
    tocBtn.addEventListener("click", function () {
      setToc(!document.body.classList.contains("toc-open"));
    });
    if (tocScrim) { tocScrim.addEventListener("click", function () { setToc(false); }); }
    if (tocClose) { tocClose.addEventListener("click", function () { setToc(false); }); }
    toc.addEventListener("click", function (ev) {
      if (ev.target.closest("a")) { setToc(false); }
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && document.body.classList.contains("toc-open")) { setToc(false); }
    });
  }
})();

(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('nav.toc a'));
  if (!links.length || !window.IntersectionObserver) return;
  var order = [], byId = {};
  links.forEach(function (a) {
    var id = a.getAttribute('href').slice(1);
    if (document.getElementById(id)) { order.push(id); byId[id] = a; }
  });
  var visible = {};
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting; });
    var current = null;
    for (var i = 0; i < order.length; i++) { if (visible[order[i]]) { current = order[i]; break; } }
    links.forEach(function (a) { a.removeAttribute('aria-current'); });
    if (current) byId[current].setAttribute('aria-current', 'true');
  }, { rootMargin: '0px 0px -72% 0px' });
  order.forEach(function (id) { io.observe(document.getElementById(id)); });
})();

(function () {
  // One entry per concept this document owns. `avoid` lists the near-misses
  // this document has actually seen, i.e. the residue of picking a canonical
  // term; it is not a general denylist of bad words.
  var GLOSS = window.GLOSS || {
    "replace-key": {
      t: "REPLACE 詞卡標題",
      d: "REPLACE 一句話定義,讀者第一次看到這個名字時需要的全部。",
      avoid: ["REPLACE 這個概念的別名"]
    }
  };
  var card = document.getElementById("gloss-card");
  var backdrop = document.getElementById("gloss-backdrop");
  var titleEl = document.getElementById("gloss-card-title");
  var textEl = document.getElementById("gloss-card-text");
  if (!card || !backdrop || !titleEl || !textEl) return;

  function placeNear(el) {
    var r = el.getBoundingClientRect();
    var top = r.bottom + window.scrollY + 6;
    var left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - card.offsetWidth - 12);
    card.style.top = top + "px";
    card.style.left = Math.max(window.scrollX + 12, left) + "px";
  }
  function openGloss(el) {
    var e = GLOSS[el.getAttribute("data-gloss")];
    if (!e) return;
    titleEl.textContent = e.t;
    textEl.textContent = e.d;
    card.style.display = "block";
    backdrop.style.display = "block";
    placeNear(el);
  }
  function closeGloss() {
    card.style.display = "none";
    backdrop.style.display = "none";
  }
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button.term");
    if (btn) { ev.preventDefault(); openGloss(btn); return; }
    if (!ev.target.closest("#gloss-card")) closeGloss();
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeGloss(); });
  window.addEventListener("resize", closeGloss);
})();

/* 原文對照面板。點圖上帶小圓點的節點，或句子裡的 .peek 小標籤，右側滑出原文。
   停用 JS 時面板不會出現，出處仍在每一節末尾的引文行，所以資訊不會消失。 */
(function () {
  var MAP = JSON.parse(document.getElementById("SRC_MAP").textContent);
  var pane = document.getElementById("srcpane");
  var scrim = document.getElementById("srcscrim");
  var last = null;

  function codeBlock(d) {
    var pre = document.createElement("pre");
    var codeEl = document.createElement("code");
    d.lines.forEach(function (line, i) {
      var n = d.start + i;
      var row = document.createElement("span");
      row.className = d.hi.indexOf(n) >= 0 ? "l hi" : "l";
      var num = document.createElement("span");
      num.className = "ln";
      num.textContent = String(n);
      row.appendChild(num);
      row.appendChild(document.createTextNode(line));
      codeEl.appendChild(row);
    });
    pre.appendChild(codeEl);
    return pre;
  }

  function refBlock(d) {
    var frag = document.createDocumentFragment();
    var ul = document.createElement("ul");
    ul.className = "refmeta";
    d.rows.forEach(function (r) {
      var li = document.createElement("li");
      li.innerHTML = "<b>" + r[0] + "</b>：" + r[1];
      ul.appendChild(li);
    });
    frag.appendChild(ul);
    var q = document.createElement("blockquote");
    q.innerHTML = d.quote;
    frag.appendChild(q);
    if (d.url) {
      var p = document.createElement("p");
      p.className = "dlink";
      p.innerHTML = '<a class="xref" href="' + d.url + '">' + d.linktext + "</a>";
      frag.appendChild(p);
    }
    return frag;
  }

  function open(id, trigger) {
    var d = MAP[id];
    if (!d) return;
    last = trigger || null;
    document.getElementById("src-kind").textContent = d.kind || "";
    document.getElementById("src-title").textContent = d.title || "";
    document.getElementById("src-meta").textContent = d.meta || "";
    document.getElementById("src-why").innerHTML = d.why || "";
    var body = document.getElementById("src-body");
    body.textContent = "";
    body.appendChild(d.type === "code" ? codeBlock(d) : refBlock(d));
    pane.classList.add("on");
    scrim.classList.add("on");
    pane.setAttribute("aria-hidden", "false");
    pane.scrollTop = 0;
    pane.focus();
  }

  function close() {
    pane.classList.remove("on");
    scrim.classList.remove("on");
    pane.setAttribute("aria-hidden", "true");
    if (last && last.focus) last.focus();
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-snip]") : null;
    if (t) { open(t.getAttribute("data-snip"), t); return; }
    if (ev.target.id === "srcclose" || ev.target.id === "srcscrim") close();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { close(); return; }
    if (ev.key !== "Enter" && ev.key !== " ") return;
    var t = ev.target.closest ? ev.target.closest("[data-snip]") : null;
    if (t) { ev.preventDefault(); open(t.getAttribute("data-snip"), t); }
  });
})();

};
if (document.querySelector("nav.toc")) window.initExplainerShell();

    </script>
