<p class="dagcap" id="dagcap-how-decide">主幹是出廠路徑。菱形往右是例外。未設 gateway URL 才問後端要 box。指令沒帶 machineId 才在 box 裡跑。沒設 mock 才打 Cursor Stream。</p>