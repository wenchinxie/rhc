<p class="dagcap" id="dagcap-s8-host-turn">host 行程 26 類執行期事件共用同一份 SandTelemetry port 與同一支 adapter；緩衝上限 1000 筆，滿了先砍心跳日誌，送出失敗留底重試。</p>