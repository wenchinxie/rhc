<p class="dagcap" id="dagcap-s8-desktop-log">renderer／preload 經 IPC 交十三支報告管子，驗證沒過當場丟棄；驗證通過的走緩衝傳輸佇列，滿了砍最舊，斷線整批 spill 到本機檔案再續傳。</p>