</div>
<p class="dagcap" id="dagcap-s8-feature-buffered">四個功能模組各自帶一層小緩衝或分級規則（開窗未關、sink 未接、模組單例、結算分級），最終仍併入 desktop-log 家族同一份上傳器；緩衝 policy 各不相同，是這個家族存在的理由。</p>