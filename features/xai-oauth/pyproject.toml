[project]
name = "rhc-xai-oauth"
version = "0.0.1"
description = "xAI OAuth client for rhc (device-code, own token store)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rhc = "xai_oauth.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xai_oauth"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
