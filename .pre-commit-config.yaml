# Install once per clone: uvx pre-commit install
repos:
  - repo: local
    hooks:
      - id: explainer-check
        name: explainer types and server render
        entry: bash -c 'cd explainer && bun run check'
        language: system
        files: ^explainer/
        pass_filenames: false
      - id: explainer-catalog-lint
        name: explainer left catalog in headless Chrome
        entry: bash -c 'cd explainer && bun run lint:catalog'
        language: system
        files: ^explainer/(src|linter)/
        pass_filenames: false
